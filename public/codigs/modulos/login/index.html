<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Unidade Marketing</title>
    <link rel="stylesheet" href="../../assets/css/site.css">
    <script src="../../assets/js/login.js" defer></script>
</head>

<body class="pagina-login">
    <main class="login-container">
        <section class="login-card">
            <h1>Entrar</h1>
            <p>Acesse sua conta para favoritar os servicos da Unidade Marketing.</p>

            <form id="form-login">
                <label for="login">Login</label>
                <input type="text" id="login" name="login" required>

                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required>

                <button type="submit">Entrar</button>
            </form>

            <p id="mensagem-login" class="mensagem-login"></p>
            <a class="link-voltar-home" href="../../index.html">Voltar para a home</a>
        </section>
    </main>
</body>

</html>
